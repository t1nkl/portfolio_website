name: Build and Deploy

on:
  push:
    branches:
      - master
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Deploy to Firebase
        uses: w9jds/firebase-action@v14.20.0
        with:
          args: deploy --only hosting --project my-projects-6fe1a
        env:
          FIREBASE_TOKEN: "1//09OljRW3F82RsCgYIARAAGAkSNwF-L9Ir_kcjigL2Zq-rHaPYpb_kOYIkaLPAFkE1Deg3D6hsUct7HDCF_OABuX9DDAQoriXqVCU"
